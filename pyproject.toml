[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".venv", "__pycache__", "static/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["\\.venv/", "__pycache__/", "static/vendor/"]
files = ["app.py", "seed.py", "engine", "routes", "tests"]

[[tool.mypy.overrides]]
module = "engine.models"
# Flask-SQLAlchemy создаёт db.Model и relationship-атрибуты динамически,
# поэтому mypy не может признать их базовым классом / инструментированным
# атрибутом. Это ложные срабатывания, ограниченные одним этим модулем.
disable_error_code = ["name-defined", "attr-defined", "arg-type"]
