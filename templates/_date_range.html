{#- Фильтр по дате: единое поле с диапазоном «с — по» и календарём. -#}
{% set date_label = date_label|default('Дата создания') %}
<div class="col-12 col-md-4 col-lg-3 position-relative">
  <div class="input-group">
    <input class="form-control delta-range-input" type="text" name="date_range"
           value="{{ date_range }}" placeholder="дд.мм.гггг — дд.мм.гггг"
           autocomplete="off" title="{{ date_label }}: с — по"
           aria-label="{{ date_label }}: с — по">
    <button class="btn btn-outline-secondary px-2" type="button"
            title="Очистить диапазон дат" aria-label="Очистить диапазон дат"
            data-clear-range><i class="fa-solid fa-xmark"></i></button>
  </div>
</div>
