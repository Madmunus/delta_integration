{% extends 'base.html' %}
{% block title %}Договор № {{ contract.number }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
  <div>
    <h1 class="h4 mb-1">Договор № {{ contract.number }}</h1>
  </div>
  <div class="d-flex gap-2 flex-wrap">
    <a class="btn btn-outline-primary btn-sm"
       href="{{ url_for('contracts.edit_contract', contract_id=contract.id) }}">Редактировать</a>
  </div>
</div>

<div class="card" style="max-width: 760px;">
  <div class="card-body">
    <h2 class="h6 mb-3">Реквизиты</h2>
    {% include 'contracts/_requisites.html' %}
  </div>
</div>
{% endblock %}
